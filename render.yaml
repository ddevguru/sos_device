# ==============================================================================
# RENDER DEPLOYMENT BLUEPRINT
# Project: SOS Emergency Smart Response System (Backend + PostgreSQL Database)
# ==============================================================================
# This Infrastructure-as-Code blueprint allows 1-click deployment on Render.com.
# It automatically provisions:
# 1. A Managed PostgreSQL Database (`sos-postgres-db`)
# 2. A Node.js / Express Web Service (`sos-emergency-backend`)
# 3. Securely wires DATABASE_URL, JWT_SECRET, and IoT authentication keys
# ==============================================================================

databases:
  - name: sos-postgres-db
    databaseName: sos_db
    user: sos_admin
    region: oregon
    plan: free

services:
  - type: web
    name: sos-emergency-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: IOT_SECRET_KEY
        value: sos_iot_secure_device_secret_2026
      - key: SMS_PROVIDER
        value: mock  # Change to 'twilio' or 'fast2sms' in Render Dashboard
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sos-postgres-db
          property: connectionString
