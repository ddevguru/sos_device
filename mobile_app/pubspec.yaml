name: sos_emergency_app
description: "Smart Emergency SOS Mobile Application with IoT Hardware Button and automated SMS Dispatching"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  geolocator: ^11.0.0
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  intl: ^0.19.0
  url_launcher: ^6.2.5
  permission_handler: ^11.3.0
  flutter_blue_plus: ^1.31.14
  flutter_ringtone_player: ^3.2.0
  noise_meter: ^5.0.0
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
